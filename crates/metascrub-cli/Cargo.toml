[package]
name = "metascrub"
description = "Remove hidden metadata (location, names, dates, devices) from photos, videos, audio, documents and archives."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["metadata", "exif", "privacy", "gps", "cli"]
categories = ["command-line-utilities", "multimedia"]
# Golden tests read the fixtures, which aren't published.
exclude = ["tests/"]

[[bin]]
name = "metascrub"
path = "src/main.rs"

[dependencies]
anstream.workspace = true
anstyle.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
ctrlc.workspace = true
indicatif.workspace = true
log = { workspace = true, features = ["std"] }
metascrub-core.workspace = true
serde_json.workspace = true

[dev-dependencies]
flate2.workspace = true
tempfile.workspace = true
zip.workspace = true

[target.'cfg(unix)'.dev-dependencies]
xattr.workspace = true

[lints]
workspace = true
