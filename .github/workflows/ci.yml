name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Publishing a release on GitHub (with a new tag such as v0.2.0) builds
  # the binaries and attaches them to it.
  release:
    types: [published]

# Actions are pinned to commits, not tags: a tag can be moved to other code.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # rustup installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # exiftool is the independent check that cleaned files have no metadata left.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl
      - if: runner.os == 'macOS'
        run: brew install exiftool
      - if: runner.os == 'Windows'
        run: choco install exiftool --no-progress -y
      # LibreOffice checks that cleaned Office files still open; qpdf and
      # poppler that cleaned PDFs are valid and still render.
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libreoffice-writer-nogui libreoffice-calc-nogui libreoffice-impress-nogui qpdf poppler-utils
      # ffmpeg checks that cleaned videos and music still play; heif-convert
      # that cleaned HEIC and AVIF photos still decode.
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends ffmpeg libheif-examples libheif-plugin-libde265 libheif-plugin-aomdec
      - run: cargo test --workspace --locked
        env:
          METASCRUB_REQUIRE_EXIFTOOL: "1"
          METASCRUB_REQUIRE_FS_ATTRIBUTES: "1"
          METASCRUB_REQUIRE_LIBREOFFICE: ${{ runner.os == 'Linux' && '1' || '' }}
          METASCRUB_REQUIRE_PDF_TOOLS: ${{ runner.os == 'Linux' && '1' || '' }}
          METASCRUB_REQUIRE_ARCHIVE_TOOLS: ${{ runner.os == 'Linux' && '1' || '' }}
          METASCRUB_REQUIRE_MEDIA_TOOLS: ${{ runner.os == 'Linux' && '1' || '' }}

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Licenses, advisories (RustSec), banned and duplicate crates, sources.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # Release jobs: only when a release is published on GitHub.
  # Merging into main never publishes anything by itself.
  version:
    name: Check version
    if: github.event_name == 'release'
    needs: [test, dependencies]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - id: check
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "metascrub-cli") | .version')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the Cargo.toml version ($version)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that isn't on main."
            exit 1
          fi
          if ! grep -q "^## $version " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version — date' section."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  licenses:
    name: Third-party licenses
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: cargo install cargo-about --locked --version 0.9.3 --features cli
      - run: cargo about generate --fail --manifest-path crates/metascrub-cli/Cargo.toml about.hbs -o THIRD-PARTY-LICENSES.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: third-party-licenses
          path: THIRD-PARTY-LICENSES.md
          if-no-files-found: error

  # Generated by the binary itself, so they always match its options.
  docs:
    name: Manual pages and completions
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo build --locked -p metascrub-cli
      - name: Generate
        run: |
          mkdir -p generated/man generated/completions
          bin=target/debug/metascrub
          "$bin" man > generated/man/metascrub.1
          for page in inspect clean verify completions man; do
            "$bin" man "$page" > "generated/man/metascrub-$page.1"
          done
          "$bin" completions bash > generated/completions/metascrub.bash
          "$bin" completions zsh > generated/completions/_metascrub
          "$bin" completions fish > generated/completions/metascrub.fish
          "$bin" completions powershell > generated/completions/_metascrub.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs
          path: generated
          if-no-files-found: error

  build:
    name: Build (${{ matrix.target }})
    needs: [version, licenses, docs]
    strategy:
      # Let every platform finish, so a failure only needs that one job re-run.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      ARCHIVE: metascrub-v${{ needs.version.outputs.version }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p metascrub-cli
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: third-party-licenses
          path: "${{ env.ARCHIVE }}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docs
          path: "${{ env.ARCHIVE }}"
      - name: Package
        run: |
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "$ARCHIVE"/
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/metascrub.exe" "$ARCHIVE"/
            7z a "$ARCHIVE.zip" "$ARCHIVE" > /dev/null
          else
            cp "target/${{ matrix.target }}/release/metascrub" "$ARCHIVE"/
            tar czf "$ARCHIVE.tar.gz" "$ARCHIVE"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}.*
          if-no-files-found: error

  release:
    name: Attach binaries
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: metascrub-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  # A release without binaries shouldn't stay public. Fix the cause, then
  # publish the draft again to rerun everything.
  unpublish:
    name: Turn the release back into a draft
    needs: [test, dependencies, version, licenses, docs, build, release]
    if: failure() && github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=true --repo "$GITHUB_REPOSITORY"
