[workspace]
resolver = "3"
members = ["crates/metascrub-core", "crates/metascrub-cli", "tools/make-fixtures"]
exclude = ["fuzz"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joaopedro17/metascrub"
authors = ["The MetaScrub Contributors"]

# Exact versions on purpose: several crates we depend on are young and
# maintained by individuals, so upgrades are reviewed one at a time.
[workspace.dependencies]
metascrub-core = { path = "crates/metascrub-core", version = "=1.0.0" }
anstream = "=1.0.0"
anstyle = "=1.0.14"
clap = { version = "=4.6.7", features = ["derive"] }
clap_complete = "=4.6.11"
clap_mangen = "=0.3.3"
ctrlc = "=3.5.2"
flate2 = "=1.1.10"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
indicatif = "=0.18.6"
kamadak-exif = "=0.6.1"
lopdf = { version = "=0.46.0", default-features = false }
md-5 = "=0.11.0"
quick-xml = "=0.42.0"
rayon = "=1.12.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = { version = "=0.11.1", default-features = false }
tar = { version = "=0.4.46", default-features = false }
tempfile = "=3.27.0"
walkdir = "=2.5.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
xattr = "=1.7.0"
zip = { version = "=9.2.2", default-features = false, features = ["deflate-flate2"] }

[profile.release]
strip = true
lto = "thin"

[workspace.lints.rust]
# `deny` rather than `forbid` so the one module that needs OS calls
# (Windows alternate data streams, v0.5) can opt out locally.
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Parsers read untrusted files: malformed input must return an error, never panic.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
